name: Libro MyST — GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
env:
  BASE_URL: ''
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installa MyST
        run: npm install -g mystmd@1.10.1
      - name: Compila il libro
        run: myst build --html --strict
      - name: Controlla gli allegati pubblicati
        run: node tools/check-assets.mjs
      - name: Controlla pagine, rimandi e soluzioni
        run: python tools/check-site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
      - name: Attendi la disponibilità del pacchetto
        run: sleep 20
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
